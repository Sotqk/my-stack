version: '3.8'

services:
  web1:
    image: nginx
    volumes:
      - ./html1:/usr/share/nginx/html
    depends_on:
      - db

  web2:
    image: nginx
    volumes:
      - ./html2:/usr/share/nginx/html
    depends_on:
      - db

  balancer:
    image: nginx
    ports:
      - "8080:80"
    volumes:
      - ./balancer.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web1
      - web2

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_USER: admin
      POSTGRES_DB: myapp
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  pgdata:

